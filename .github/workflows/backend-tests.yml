name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: dtuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: digital_twin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements-dev.txt
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run linting
      working-directory: ./backend
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
    
    - name: Run type checking
      working-directory: ./backend
      continue-on-error: true
      run: |
        mypy app --ignore-missing-imports
    
    - name: Run tests with coverage
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://dtuser:testpassword@localhost:5432/digital_twin_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-min-32-chars-long-for-testing
        APP_ENV: test
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-report=html
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Upload coverage HTML
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: backend/htmlcov/
    
    - name: Check coverage threshold
      working-directory: ./backend
      run: |
        coverage report --fail-under=70
    
    - name: Generate test report
      if: always()
      working-directory: ./backend
      run: |
        pytest tests/ --tb=short --junitxml=junit.xml || true
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          backend/junit.xml

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: dtuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: digital_twin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run integration tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://dtuser:testpassword@localhost:5432/digital_twin_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-min-32-chars-long-for-testing
        APP_ENV: test
      run: |
        pytest tests/test_api/ tests/test_e2e/ -v -m "integration or e2e" --tb=short

  security-check:
    name: Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        pip install safety bandit
    
    - name: Run safety check
      working-directory: ./backend
      continue-on-error: true
      run: |
        safety check --json
    
    - name: Run bandit security linter
      working-directory: ./backend
      continue-on-error: true
      run: |
        bandit -r app -f json -o bandit-report.json || true
        bandit -r app -f screen

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        pip install -r requirements-dev.txt
    
    - name: Run black check
      working-directory: ./backend
      run: |
        black --check app tests
    
    - name: Run isort check
      working-directory: ./backend
      run: |
        isort --check-only app tests
    
    - name: Run pylint
      working-directory: ./backend
      continue-on-error: true
      run: |
        pylint app tests --exit-zero
