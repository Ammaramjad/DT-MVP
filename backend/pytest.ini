[pytest]
# Pytest configuration for AI Digital Twin SaaS Platform

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Add options
addopts = 
    -ra
    -v
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --cov-fail-under=80
    --maxfail=5

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints
    e2e: End-to-end workflow tests
    slow: Tests that take a long time to run
    database: Tests that require database access
    auth: Tests related to authentication
    rbac: Tests related to role-based access control
    manufacturing: Tests for manufacturing vertical
    energy: Tests for energy vertical
    retail: Tests for retail vertical
    ml_service: Tests that interact with ML service

# Coverage options
[coverage:run]
source = app
omit = 
    */tests/*
    */migrations/*
    */alembic/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
